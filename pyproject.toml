[project]
name = "agentopsd"
version = "0.1.0"
description = "AgentOPSD (recursive self-distillation for agentic RL) — 8B training-stability harness built on SDAR"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentOPSD team" }]
dependencies = [
    "numpy>=1.26",
    "torch>=2.1",
    "omegaconf",
    "hydra-core>=1.3",
    "datasets>=2.19",
    "pyyaml",
    "pandas",
    "wandb",
    "transformers",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentopsd"]

[tool.pytest.ini_options]
testpaths = ["scripts"]

